<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận Đăng xuất | E-Learning Platform</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: var(--font-family);
    }

    .logout-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-3xl);
      box-shadow: var(--shadow-modal);
      max-width: 460px;
      width: 100%;
      padding: 36px 32px;
      text-align: center;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .logout-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      color: #EF4444;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .student-info-box {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl);
      padding: 16px 18px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .student-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    .info-note {
      background: rgba(67, 76, 232, 0.05);
      border: 1px dashed rgba(67, 76, 232, 0.25);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 20px;
      text-align: left;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-logout-confirm {
      width: 100%;
      height: 48px;
      background: #EF4444;
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-xl);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-fast);
    }

    .btn-logout-confirm:hover {
      background: #DC2626;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transform: translateY(-1px);
    }

    .btn-cancel {
      width: 100%;
      height: 46px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .btn-cancel:hover {
      background: var(--bg-canvas);
      color: var(--text-heading);
      border-color: #CBD5E1;
    }
  </style>
</head>

<body>

  <div class="logout-card">

    <!-- Logo thương hiệu -->
    <a href="../../index.html" class="brand-logo-wrap">
      <div class="logo-icon"
        style="width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <span class="logo-text"
        style="font-size: 17px; font-weight: 800; color: var(--text-heading);">E-Learning<span>.</span></span>
    </a>

    <!-- Biểu tượng Đăng xuất -->
    <div class="logout-icon-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>

    <!-- Tiêu đề và thông điệp xác nhận -->
    <h2 class="h3" style="margin-bottom: 6px; color: var(--text-heading);">Xác nhận đăng xuất</h2>
    <p class="body-2" style="color: var(--text-secondary); margin: 0 auto; line-height: 22px;">
      Bạn có chắc chắn muốn kết thúc phiên làm việc hiện tại?
    </p>

    <!-- Hệ thống tự động nhận diện tài khoản học viên -->
    <div class="student-info-box">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
        alt="Avatar Học viên" class="student-avatar">
      <div style="flex: 1; line-height: 1.3;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
          <strong style="font-size: 14px; color: var(--text-heading);">Nguyễn Văn A</strong>
          <span class="badge badge-success" style="font-size: 11px; padding: 2px 8px;">Học viên</span>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary);">nguyenvana.student@elearning.vn</div>
      </div>
    </div>

    <!-- Ghi chú lưu tiến độ & điều hướng -->
    <div class="info-note">
      <span style="color: var(--primary); font-size: 15px; line-height: 1;">ℹ️</span>
      <span>Hệ thống đã tự động lưu toàn bộ tiến độ video và khóa học của bạn. Khi đăng xuất, bạn sẽ được đưa về
        <strong>Trang chủ</strong> an toàn.</span>
    </div>

    <!-- Nút hành động -->
    <div class="btn-action-group">
      <button type="button" class="btn-logout-confirm" id="btn-logout" onclick="handleLogoutSubmit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Đăng xuất</span>
      </button>

      <a href="../../index.html" class="btn-cancel" onclick="handleCancel(event)">
        Hủy và tiếp tục học
      </a>
    </div>

  </div>

  <script src="../../assets/js/app.js"></script>
  <script>
    function handleLogoutSubmit() {
      const btn = document.getElementById('btn-logout');
      btn.innerHTML = '<span>Đang đăng xuất...</span>';
      btn.disabled = true;

      // Hiển thị thông báo xác nhận thành công
      showToast('Đã đăng xuất tài khoản thành công! Đang chuyển hướng về Trang chủ (Chưa đăng nhập)...', 'success');

      // Tự động chuyển hướng về Trang chủ chưa đăng nhập theo quy chuẩn Học viên
      setTimeout(() => {
        window.location.href = '../../index-guest.html';
      }, 1000);
    }

    function handleCancel(e) {
      e.preventDefault();
      // Nếu có lịch sử duyệt thì quay lại trang trước, không thì về index bản đã đăng nhập
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        window.location.href = '../../index.html';
      }
    }
  </script>
</body>

</html>
